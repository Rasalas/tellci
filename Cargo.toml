[package]
name = "tellci"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A tiny CLI for writing simple CI feedback as JUnit XML"
license = "MIT"
repository = "https://github.com/Rasalas/tellci"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
